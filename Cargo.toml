[package]
name = "trustd"
autobins = false
default-run = "trustd"
version = "0.1.0"
edition = "2024"
description = "User-controlled trust, execution identities and credentials for AI agents"
license = "MIT"

# Keep the Rust library identity stable for embedders; executable roles are separate.
[lib]
name = "localshelld"

[[bin]]
name = "trustd"
path = "src/main.rs"

[[bin]]
name = "trustd-user"
path = "src/bin/user.rs"
required-features = ["desktop"]

[[bin]]
name = "trustd-user-headless"
path = "src/bin/user_headless.rs"

[[bin]]
name = "trustd-system"
path = "src/bin/system.rs"

[[bin]]
name = "trustd-root"
path = "src/bin/root.rs"

[[bin]]
name = "trustd-stdio"
path = "src/bin/stdio.rs"

[[example]]
name = "desktop_smoke"
required-features = ["desktop"]

[workspace]
members = ["crates/native-dialog", "crates/native-process", "crates/sync-protocol", "crates/sync-server", "crates/telegram"]

[features]
default = ["desktop"]
desktop = ["dep:gtk", "dep:wry", "dep:tao", "dep:localshelld-native-dialog"]

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
argon2 = "0.5"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
directories = "6"
flate2 = "1"
fs2 = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "system-proxy"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tar = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
toml = "0.9"
toml_edit = "0.23"
jsonc-parser = { version = "0.34", features = ["cst", "serde"] }
totp-rs = { version = "5.7", features = ["otpauth"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
webauthn-rs = "0.5.5"
include_dir = "0.7"
mime_guess = "2"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
zeroize = { version = "1", features = ["derive"] }
localshelld-sync-protocol = { path = "crates/sync-protocol" }
localshelld-telegram = { path = "crates/telegram" }
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
netstat2 = "0.11"

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.31", default-features = false, features = ["signal"] }
rpassword = "7.5"
gtk = { version = "0.18", optional = true }
wry = { version = "0.54", optional = true }
tao = { version = "0.34", optional = true }

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
openssl = { version = "0.10", features = ["vendored"] }
localshelld-native-dialog = { path = "crates/native-dialog", optional = true }
localshelld-native-process = { path = "crates/native-process" }

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"
localshelld-native-dialog = { path = "crates/native-dialog", optional = true }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[build-dependencies]
semver = "1"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1

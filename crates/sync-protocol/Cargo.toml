[package]
name = "localshelld-sync-protocol"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
webauthn-rs = "0.5.5"
zeroize = { version = "1", features = ["derive"] }
openssl = { version = "0.10", optional = true }

[features]
# Software owner passkey for other crates' tests.
testing = ["dep:openssl"]

[dev-dependencies]
openssl = "0.10"

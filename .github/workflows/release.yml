name: Release

on:
  push:
    tags:
      - 'v*'
      - '!v*-rc.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: trustd-windows-x86_64
            binary: target/release/trustd.exe
          - os: ubuntu-24.04
            artifact: trustd-linux-x86_64
            binary: target/release/trustd
          - os: macos-15
            artifact: trustd-macos-aarch64
            binary: target/release/trustd
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/prepare-build
      - name: Validate and embed the release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          test "$GITHUB_REF_NAME" = "v$version"
          echo "LOCALSHELLD_RELEASE_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-
      - name: Prepare Windows OpenSSL debug symbols
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/prepare-windows-openssl.ps1
      - run: cargo test --workspace --all-targets
      - run: cargo test --workspace --all-targets --no-default-features
      - name: Validate MCP tool schemas with the official TypeScript SDK
        working-directory: web
        run: pnpm test:mcp
      - name: Validate headless MCP tool schemas
        run: |
          cargo build --no-default-features --bin trustd-stdio
          node --test web/tests/mcp/stdio.test.mjs
      - name: Build the unified desktop and headless bundle
        shell: bash
        run: bash scripts/build-bundle.sh
      - name: Verify headless bundle without desktop runtime libraries
        if: runner.os == 'Linux'
        run: bash scripts/test-headless-runtime.sh target/release
      - name: Verify embedded version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          BINARY: ${{ matrix.binary }}
        run: |
          bash scripts/verify-release.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.binary }}
            target/release/trustd-user
            target/release/trustd-user.exe
            target/release/trustd-user-headless
            target/release/trustd-user-headless.exe
            target/release/trustd-stdio
            target/release/trustd-stdio.exe
            target/release/trustd-system.exe
            target/release/trustd-root
            target/release/release-version.txt

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: binaries
          merge-multiple: false
      - name: Package verified binaries
        env:
          LOCALSHELLD_RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/package-release.sh
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" assets/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes

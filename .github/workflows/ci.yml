name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: macos-15
            platform: macos-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/prepare-build
      - name: Embed the matching release candidate version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          echo "LOCALSHELLD_RELEASE_TAG=v${version}-rc.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        id: toolchain
        with:
          components: rustfmt, clippy
      - name: Cache Rust dependencies and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-v2-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock', '.github/actions/prepare-build/action.yml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-v2-${{ steps.toolchain.outputs.cachekey }}-
            ${{ runner.os }}-${{ runner.arch }}-cargo-
      - name: Verify PowerShell
        if: runner.os == 'Windows'
        shell: pwsh
        run: $PSVersionTable.PSVersion
      - name: Verify system Bash
        if: runner.os != 'Windows'
        shell: bash
        run: /bin/bash --version
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings
      - run: cargo test --workspace --all-targets
      - run: cargo test --workspace --all-targets --no-default-features
      - name: Bootstrap verification and temporary-file cleanup tests
        run: python -m unittest discover -s scripts -p 'test_bootstrap.py' -v
      - name: Validate MCP tool schemas with the official TypeScript SDK
        working-directory: web
        run: pnpm test:mcp
      - name: Validate headless MCP tool schemas
        run: |
          cargo build --no-default-features --bin trustd-stdio
          node --test web/tests/mcp/stdio.test.mjs
      - name: Browser and WebAuthn integration tests
        if: runner.os == 'Linux'
        run: |
          pnpm --dir web exec playwright install --with-deps chromium
          pnpm --dir web test:e2e
      - name: Browser test diagnostics
        if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-test-diagnostics
          path: web/test-results/
      - name: Build the unified desktop and headless bundle
        shell: bash
        run: bash scripts/build-bundle.sh
      - name: Verify headless bundle without desktop runtime libraries
        if: runner.os == 'Linux'
        run: bash scripts/test-headless-runtime.sh target/release
      - name: Verify real user and root daemon identities
        if: runner.os != 'Windows'
        env:
          TRUSTD_HEADLESS: '1'
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
          python3 scripts/test-dual-daemon.py target/release/trustd
      - name: Verify embedded version
        if: env.LOCALSHELLD_RELEASE_TAG != ''
        shell: bash
        run: |
          bash scripts/verify-release.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trustd-${{ matrix.platform }}
          path: |
            target/release/trustd
            target/release/trustd.exe
            target/release/trustd-user
            target/release/trustd-user.exe
            target/release/trustd-user-headless
            target/release/trustd-user-headless.exe
            target/release/trustd-stdio
            target/release/trustd-stdio.exe
            target/release/trustd-system.exe
            target/release/trustd-root
            target/release/release-version.txt
          if-no-files-found: error
